<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

/* Background */
body {
    height: 100vh;
    background: linear-gradient(to right, #3a0ca3, #4361ee);
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
}

/* Container */
.container {
    text-align: center;
}

/* Title */
h1 {
    margin-bottom: 20px;
}

/* Board */
.board {
    display: grid;
    grid-template-columns: repeat(3, 100px);
    gap: 10px;
    justify-content: center;
    margin-bottom: 20px;
}

/* Cells */
.cell {
    width: 100px;
    height: 100px;
    background: rgba(255,255,255,0.1);
    border-radius: 15px;
    font-size: 40px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: 0.3s;
}

.cell:hover {
    background: rgba(255,255,255,0.2);
}

/* Button */
button {
    padding: 10px 20px;
    border: none;
    border-radius: 10px;
    background: #f72585;
    color: white;
    cursor: pointer;
    font-size: 16px;
}

button:hover {
    transform: scale(1.1);
}

/* Status */
#status {
    margin-bottom: 15px;
    font-size: 18px;
}
</style>
</head>

<body>

<div class="container">
    <h1>Tic Tac Toe</h1>
    <div id="status">Player X Turn</div>

    <div class="board" id="board">
        <div class="cell" onclick="play(this,0)"></div>
        <div class="cell" onclick="play(this,1)"></div>
        <div class="cell" onclick="play(this,2)"></div>
        <div class="cell" onclick="play(this,3)"></div>
        <div class="cell" onclick="play(this,4)"></div>
        <div class="cell" onclick="play(this,5)"></div>
        <div class="cell" onclick="play(this,6)"></div>
        <div class="cell" onclick="play(this,7)"></div>
        <div class="cell" onclick="play(this,8)"></div>
    </div>

    <button onclick="resetGame()">Restart</button>
</div>

<script>
let board = ["","","","","","","","",""];
let currentPlayer = "X";
let gameActive = true;

function play(cell, index) {
    if (board[index] !== "" || !gameActive) return;

    board[index] = currentPlayer;
    cell.innerText = currentPlayer;

    checkWinner();

    currentPlayer = currentPlayer === "X" ? "O" : "X";
    document.getElementById("status").innerText = "Player " + currentPlayer + " Turn";
}

function checkWinner() {
    let winPatterns = [
        [0,1,2],[3,4,5],[6,7,8],
        [0,3,6],[1,4,7],[2,5,8],
        [0,4,8],[2,4,6]
    ];

    for (let pattern of winPatterns) {
        let [a,b,c] = pattern;

        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
            document.getElementById("status").innerText = "Player " + board[a] + " Wins!";
            gameActive = false;
            return;
        }
    }

    if (!board.includes("")) {
        document.getElementById("status").innerText = "Draw!";
        gameActive = false;
    }
}

function resetGame() {
    board = ["","","","","","","","",""];
    currentPlayer = "X";
    gameActive = true;

    document.getElementById("status").innerText = "Player X Turn";

    let cells = document.querySelectorAll(".cell");
    cells.forEach(cell => cell.innerText = "");
}
</script>

</body>
</html>
